<!DOCTYPE html>
<html lang="it">

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #1c1915;
      color: #f5f0e6;
    }

      padding: 1.5rem 1.25rem 2.5rem;
    }

      font-size: 1.45rem;
      line-height: 1.3;
      margin: 0 0 1rem;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.45;
      margin: 0 0 1rem;
    }

      color: #f0c36a;
    }
  </style>

<body>
  <main>
    <h1>Il server di mirror non è raggiungibile.</h1>

    <p>Il sito di produzione resta disponibile su <a href="https://www.kor35.it/">www.kor35.it</a>.</p>
