# Salto per il deploy GitHub verso il Pi, quando il DDNS non è raggiungibile.
# L'utente non ha una shell: può solo inoltrare TCP verso la SSH del Pi
# pubblicata dalla galleria su 127.0.0.1:18022.

Match User kor35-mirror-jump
    AllowTcpForwarding local
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    PermitOpen 127.0.0.1:18022
    PasswordAuthentication no
    AuthenticationMethods publickey
    ForceCommand /bin/false
