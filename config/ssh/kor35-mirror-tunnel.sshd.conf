# Utente dedicato alla galleria del mirror. Non apre una shell.
# GatewayPorts resta no: il forward è solo 127.0.0.1 (vedi permitlisten).

Match User kor35-tunnel
    AllowTcpForwarding remote
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    PermitOpen none
    PasswordAuthentication no
    AuthenticationMethods publickey
    ClientAliveInterval 30
    ClientAliveCountMax 3
